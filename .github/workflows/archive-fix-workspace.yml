name: Archive fix workspace
on:
  push:
    branches: [fix/archive-projection-identity]
    paths: [.github/workflows/archive-fix-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: pwa
      - name: Package locked test dependencies
        run: tar -czf /tmp/pwa-test-deps.tar.gz -C pwa node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: archive-fix-pwa-deps
          path: /tmp/pwa-test-deps.tar.gz
          retention-days: 1
