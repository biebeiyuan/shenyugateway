name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -x -q

  pwa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm test
        working-directory: pwa
      - run: npm run build
        working-directory: pwa

  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: admin
      - name: Install Playwright Chromium dependencies
        working-directory: admin
        shell: bash
        run: |
          # The hosted image may carry a stale Google Chrome apt index. It is
          # unrelated to Playwright's Chromium dependencies and can make apt
          # fail before Playwright starts; remove only that temporary source.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -name '*.list' \
            -exec sed -i '\|dl.google.com/linux/chrome|d' {} +
          # The hosted runner's Google apt mirror can briefly publish an index
          # whose hash does not match the Release file. Retry the install so a
          # transient mirror race does not hide the actual smoke result.
          for attempt in 1 2 3; do
            if npm run test:e2e:install; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - run: npm run test:e2e
        working-directory: admin
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            admin/playwright-report/
            admin/test-results/
          if-no-files-found: ignore
          retention-days: 7
