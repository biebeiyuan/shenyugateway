name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Deliberately no `fetch-depth: 0`. Nothing in CI reads co-edit history,
      # and the default shallow checkout is what caught a test that leaned on
      # this repository's real `git log` (406b6b9) — it passed locally and went
      # red only here. Deepening the clone would remove that guard to buy
      # nothing. Add it in the same change as whatever first needs real history.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -x -q

  pwa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
        working-directory: pwa
      - run: npm test
        working-directory: pwa
      - run: npm run build
        working-directory: pwa

  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: pwa
      - name: Install Playwright Chromium dependencies
        working-directory: admin
        shell: bash
        run: |
          # The hosted image may carry a stale Google Chrome apt source. It is
          # unrelated to Playwright's Chromium dependencies and can make apt
          # fail before Playwright starts; remove it entirely.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          # The hosted runner's Google apt mirror can briefly publish an index
          # whose hash does not match the Release file. Retry the install so a
          # transient mirror race does not hide the actual smoke result.
          for attempt in 1 2 3; do
            if npm run test:e2e:install; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
      - run: npm run test:e2e
        working-directory: admin
      - name: Upload Playwright report and album screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            admin/playwright-report/
            admin/test-results/
          if-no-files-found: ignore
          retention-days: 7

  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE_TAG: shenyu-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the production Dockerfile without publishing
        run: docker build --pull --build-arg SOURCE_COMMIT="$(git rev-parse HEAD)" --tag "$IMAGE_TAG" .
      - name: Check packaged archive CLI offline
        run: docker run --rm --network none "$IMAGE_TAG" python scripts/local_chat_archive.py --help
      - name: Check linked SQLite and unchanged default backend offline
        run: >-
          docker run --rm --network none "$IMAGE_TAG" python -c
          "import _sqlite3, sqlite3, sys; from shenyu_gateway.config import RuntimeConfig;
          cfg = RuntimeConfig(); source = sqlite3.connect(':memory:').execute('select sqlite_source_id()').fetchone()[0];
          print('SQLite', sqlite3.sqlite_version, 'source', source, 'module', _sqlite3.__file__, 'archive backend', cfg.chat_archive_backend);
          sys.exit(0 if sqlite3.sqlite_version_info >= (3, 51, 3) and source.startswith('2026-03-13') and cfg.chat_archive_backend == 'supabase' else 1)"
