name: Album offline workbench
on:
  push:
    branches: [work/album-offline-workbench]
    paths: [.github/workflows/album-offline-workbench.yml]
permissions:
  contents: read
jobs:
  export-final-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c13056ab18c6c08efb19c74647cacef34d21189
          persist-credentials: false
          fetch-depth: 0
      - name: Export source without credentials or runtime data
        run: |
          git bundle create /tmp/album-final-source.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/album-final-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: album-final-source
          path: |
            /tmp/album-final-source.bundle
            /tmp/album-final-source.txt
          retention-days: 1
