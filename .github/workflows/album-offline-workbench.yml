name: Album offline workbench
on:
  push:
    branches: [work/album-offline-workbench]
    paths: [.github/workflows/album-offline-workbench.yml]
permissions:
  contents: read
jobs:
  export-review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37690c6730b6a0fd8b672d6d0e01db4e3343c699
          persist-credentials: false
          fetch-depth: 0
      - name: Export Git objects only, never credentials or working data
        run: |
          test "$(git rev-parse HEAD)" = 37690c6730b6a0fd8b672d6d0e01db4e3343c699
          git bundle create /tmp/album-review-source.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/album-review-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: album-review-source
          path: |
            /tmp/album-review-source.bundle
            /tmp/album-review-source.txt
          retention-days: 1
