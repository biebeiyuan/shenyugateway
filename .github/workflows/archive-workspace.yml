name: Verify archive review and retire workspace
on:
  push:
    branches: [work/local-chat-archive]
    paths: [.github/workflows/archive-workspace.yml]
permissions:
  contents: write
jobs:
  verify-and-record:
    if: github.ref == 'refs/heads/work/local-chat-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally verified review patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = a785d5bc026d7bd845266ff4d51277936f53c62d
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, zlib
          shas = [
              'a96ed101b9a02486a39655940fe17a751c96ff36',
              '057eeab8c328f17a73b1b5794d9d50b6baf71b45',
              'd9172acdf281df2edb67618d5fb89c2b244621f8',
              '3824eface808347dbeea6bc345080c82722119b5',
              'ac1ec319191d5dbfe90e561921a7a22eb12174b7',
              '527828dc9ef3e9dce84ea79fa7db93565de8c712',
              '6f21a39edf92dfe191ea57df8e81c82196bd424d',
              '99276b0ca599514efafa330f9b473a5e720b20e4',
          ]
          parts = []
          for sha in shas:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/biebeiyuan/shenyugateway/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              parts.append(base64.b64decode(blob['content']))
          patch = zlib.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '4bd868f17200e4558f5d80dfece550329eda97f14d8f8e68eefa9fc5da81e393'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'archive-review.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check "$RUNNER_TEMP/archive-review.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/archive-review.patch"
          git rm .github/workflows/archive-workspace.yml
          git add Dockerfile docs/architecture/REQUEST_CONTEXT.md docs/history/2026-09-17-local-chat-archive.md project_delivery_log.jsonl scripts/local_chat_archive.py shenyu_gateway/chat_archive.py shenyu_gateway/config_routes.py shenyu_gateway/local_chat_archive.py tests/archive_read_benchmark.py tests/test_archive_review.py
      - run: pip install -e '.[dev]'
      - name: Backend and boundary verification
        run: |
          python -m pytest tests/ -x -q
          python -m py_compile shenyu_gateway/local_chat_archive.py shenyu_gateway/chat_archive.py shenyu_gateway/config_routes.py scripts/local_chat_archive.py
          python scripts/resident_home.py check
          git diff --cached --check
      - name: PWA verification
        working-directory: pwa
        run: |
          npm ci
          npm test
          npm run build
      - name: Admin verification
        working-directory: admin
        run: |
          npm ci
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          for attempt in 1 2 3; do
            if npm run test:e2e:install; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          npm run test:e2e
      - name: Commit tested fixes and workflow removal to feature branch only
        run: |
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          test ! -e .github/workflows/archive-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address local archive review with measured indexed reads and deployment guards'
          git push origin HEAD:refs/heads/work/local-chat-archive
