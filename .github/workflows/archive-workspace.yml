name: Archive workspace snapshot
on:
  push:
    branches: [work/local-chat-archive]
    paths: [.github/workflows/archive-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/shenyu-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: archive-workspace-source
          path: ${{ runner.temp }}/shenyu-source.tar.gz
          retention-days: 1
          if-no-files-found: error
