name: Archive workspace snapshot
on:
  push:
    branches: [work/local-chat-archive]
    paths: [.github/workflows/archive-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: pwa
      - run: npm ci
        working-directory: admin
      - name: Package locked dependencies for isolated tests
        run: tar -czf "$RUNNER_TEMP/frontend-dependencies.tar.gz" pwa/node_modules admin/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: archive-frontend-dependencies
          path: ${{ runner.temp }}/frontend-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
