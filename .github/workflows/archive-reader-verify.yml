name: Verify archive reader repair
on:
  push:
    branches: [fix/archive-projection-identity]
    paths: [.github/workflows/archive-reader-verify.yml]
permissions:
  contents: write
jobs:
  verify-repair:
    if: github.ref == 'refs/heads/fix/archive-projection-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/archive-projection-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact tested source; refuse changed inputs
        env:
          SOURCE0: ''
          SOURCE1: ''
          SOURCE2: ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'a7406f243a52e0b18c5faec13c7c04af6abf00cc'
          python - <<'PY'
          import os, base64, hashlib, lzma, json, pathlib, subprocess
          raw = lzma.decompress(base64.b64decode(''.join(os.environ['SOURCE'+str(i)] for i in range(3)), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '38e50d3396e3d1a8abd20633d1ee166620cc6065d072e8104b5d1d9c4eaae39b'
          entries = json.loads(raw)
          allowed = {'DEBUGGING_GUIDE.md','README.md','docs/architecture/REQUEST_CONTEXT.md','docs/architecture/SYSTEM_ZONES.md','project_delivery_log.jsonl','pwa/src/session/reconcile.ts','pwa/tests/recoveryIdentity.spec.ts','shenyu_gateway/gateway_tools/_recall.py','shenyu_gateway/local_chat_archive.py','tests/test_recall_archive_backend.py'}
          assert len(entries) == len(allowed) and {e['path'] for e in entries} == allowed
          outputs = []
          for e in entries:
              p = pathlib.Path(e['path'])
              assert not p.is_symlink()
              if e['before'] is None:
                  assert not p.exists(), str(p)
                  old = b''
              else:
                  old = p.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == e['before'], str(p)
              lines = old.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(e['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              output = ''.join(lines).encode()
              assert hashlib.sha256(output).hexdigest() == e['after'], str(p)
              outputs.append((p, output))
          for p, output in outputs:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(output)
              print('Verified source:', p)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','rm','--','.github/workflows/archive-reader-verify.yml'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == 'c011b5257cf55811cf8998da516868de10a5ef07'
          PY
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/ -x -q
      - run: python scripts/resident_home.py check && git diff --cached --check
      - run: npm ci && npm test && npm run build
        working-directory: pwa
      - name: Commit verified repair only to repair branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/archive-projection-identity'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: route chat recall to active archive and guard recovery identity'
          git push origin HEAD:refs/heads/fix/archive-projection-identity
          echo "Verified commit: $(git rev-parse HEAD)"
