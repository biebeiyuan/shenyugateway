name: Echo map isolated edit
on:
  push:
    branches: [chatgpt/echo-map-editor-20260918]
    paths: [.github/workflows/echo-map-editor.yml]
permissions:
  contents: read
jobs:
  edit-maps:
    if: github.repository == 'biebeiyuan/shenyugateway' && github.ref == 'refs/heads/chatgpt/echo-map-editor-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHON_DOTENV_DISABLED: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
      ANTHROPIC_API_KEY: ''
      ENABLE_CHAT_ARCHIVE: 'false'
      ENABLE_HEARTBEAT_ARCHIVE: 'false'
      ENABLE_RECALL_SYNC_WORKER: 'false'
      ENABLE_RECALL_EMBEDDING_WORKER: 'false'
    steps:
      # Checkout only the reviewed PR head. This temporary workflow never enters
      # the result branch, and this job cannot deploy or push to master.
      - uses: actions/checkout@v4
        with:
          ref: b8ccf1e03f32bf5f2cd2936774857c1b4ac111b9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Edit only verified map text
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = b8ccf1e03f32bf5f2cd2936774857c1b4ac111b9
          test -z "$(git status --porcelain)"
          git switch -c chatgpt/echo-map-result-20260918
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/echo-map-check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path, before, after):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              assert text.count(before) == 1, (path, before)
              file.write_text(text.replace(before, after), encoding='utf-8', newline='\n')

          routes = Path('shenyu_gateway/config_routes.py').read_text(encoding='utf-8')
          for route in ('@router.get("/api/config")', '@router.get("/api/config/full")', '@router.post("/api/config")'):
              assert route in routes, route
          assert '/api/gateway/config' not in routes
          frontend = Path('admin/src/api/config.ts').read_text(encoding='utf-8')
          assert "api.get('/api/config/full')" in frontend
          assert "api.post('/api/config', patch)" in frontend
          runtime = Path('shenyu_gateway/runtime.py').read_text(encoding='utf-8')
          assert 'store.save_config_overrides(' in runtime

          replace_once('README.md',
              'configuration API routes (`GET /api/gateway/config` reads the running config; `POST /api/gateway/config` updates it).',
              'configuration API routes (`GET /api/config` reads the masked config; `GET /api/config/full` reads the Admin form; `POST /api/config` updates it).')
          replace_once('README.md',
              'are persisted to `.env` via `runtime.py::persist_env()`,',
              'are persisted to `.env` and SQLite config overrides via `runtime.py::persist_env()`,')
          replace_once('README.md',
              '- `admin/src/views/ConfigView.vue`: configuration page.',
              '- `admin/src/views/ConfigView.vue`: configuration page, including the 回响 (Echo) enable switch, saved prompt, and retention controls. Switch behavior is defined in `docs/architecture/REQUEST_CONTEXT.md` § Context Layers.')
          # Keep the original closing pointer; the intended entry change is
          # the one direct Echo task row, not a rewrite of unrelated copy.
          replace_once('START_HERE.md',
              '文档状态、历史设计稿和审查快照的完整索引见 `DOCS_MAP.md`。',
              '文档状态、历史设计稿和现行事实的完整索引见 `DOCS_MAP.md`。')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'README.md', 'START_HERE.md'}, changed
          diff = subprocess.check_output(['git', 'diff', '--unified=3'], text=True)
          Path('/tmp/echo-map-check/maps.patch').write_text(diff, encoding='utf-8')
          print(diff)
          PY
      - name: Verify map paths, anchors and resident boundaries
        shell: bash
        run: |
          pip install -e '.[dev]'
          python -m pytest -q tests/test_project_map.py tests/test_owner_project_map.py | tee /tmp/echo-map-check/tests.log
          python scripts/resident_home.py check | tee /tmp/echo-map-check/resident.log
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          diff = subprocess.check_output(['git', 'diff', '--unified=0'], text=True)
          added = '\n'.join(line[1:] for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++'))
          assert not re.search('淇|閺|鈹|銆|锛|紝|娌堜簣', added)
          for path in ('README.md', 'START_HERE.md'):
              assert b'\r' not in Path(path).read_bytes(), path
          stale = subprocess.run(['git', 'grep', '-n', '/api/gateway/config', '--', '*.md', ':(exclude)docs/history/**'], text=True, capture_output=True)
          Path('/tmp/echo-map-check/stale-route-search.txt').write_text(stale.stdout, encoding='utf-8')
          assert stale.returncode == 1, stale.stdout or stale.stderr
          PY
      - name: Publish only the documentation result on a separate ref
        shell: bash
        run: |
          test "$(git branch --show-current)" = chatgpt/echo-map-result-20260918
          test ! -e .github/workflows/echo-map-editor.yml
          git add -- README.md START_HERE.md
          git diff --cached --check
          git commit -m 'docs: correct config API map and locate echo controls'
          git push origin HEAD:refs/heads/chatgpt/echo-map-result-20260918
          git rev-parse HEAD | tee /tmp/echo-map-check/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-map-check
          path: /tmp/echo-map-check/
          retention-days: 3
