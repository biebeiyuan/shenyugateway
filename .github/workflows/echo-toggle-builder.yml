name: Echo toggle isolated builder
on:
  push:
    branches: [chatgpt/echo-toggle-builder-20260918]
    paths: [.github/workflows/echo-toggle-builder.yml]
permissions:
  contents: read
jobs:
  integrate-docs:
    if: github.repository == 'biebeiyuan/shenyugateway' && github.ref == 'refs/heads/chatgpt/echo-toggle-builder-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHON_DOTENV_DISABLED: '1'
      SUPABASE_URL: ''
      SUPABASE_SERVICE_KEY: ''
      ANTHROPIC_API_KEY: ''
      ENABLE_CHAT_ARCHIVE: 'false'
      ENABLE_HEARTBEAT_ARCHIVE: 'false'
      ENABLE_RECALL_SYNC_WORKER: 'false'
      ENABLE_RECALL_EMBEDDING_WORKER: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77bc2d042d1843a181c213c21f2138dcd7944fa0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate pinned documentation updates on an isolated ref
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = 77bc2d042d1843a181c213c21f2138dcd7944fa0
          git cat-file -e 5745174f2d57f19bf4358dac63c6bbe3a2dfa67a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c chatgpt/echo-toggle-integration-20260918
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only','c357f7d80b37608b7202ace5bb6a29af1f070961','5745174f2d57f19bf4358dac63c6bbe3a2dfa67a'], text=True).splitlines())
          assert changed <= {'docs/architecture/REQUEST_CONTEXT.md','docs/history/2026-09-17-local-chat-archive.md','project_delivery_log.jsonl'}, changed
          PY
          set +e
          git merge --no-commit --no-ff 5745174f2d57f19bf4358dac63c6bbe3a2dfa67a
          result=$?
          set -e
          test "$result" -le 1
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines())
          assert conflicts <= {'project_delivery_log.jsonl'}, conflicts
          if conflicts:
              path='project_delivery_log.jsonl'
              def read(ref):
                  return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True).splitlines()
              base=read('c357f7d80b37608b7202ace5bb6a29af1f070961')
              ours=read('77bc2d042d1843a181c213c21f2138dcd7944fa0')
              theirs=read('5745174f2d57f19bf4358dac63c6bbe3a2dfa67a')
              assert ours[:len(base)] == base and theirs[:len(base)] == base, 'Non-append change requires review'
              combined=theirs.copy()
              by_id={json.loads(line)['id']:line for line in combined if line.strip()}
              for line in ours[len(base):]:
                  if not line.strip(): continue
                  key=json.loads(line)['id']
                  if key in by_id:
                      assert by_id[key]==line, ('Conflicting delivery',key)
                  else:
                      combined.append(line)
                      by_id[key]=line
              Path(path).write_text('\n'.join(combined)+'\n',encoding='utf-8',newline='\n')
              subprocess.run(['git','add','--',path],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged <= {'docs/architecture/REQUEST_CONTEXT.md','docs/history/2026-09-17-local-chat-archive.md','project_delivery_log.jsonl'}, staged
          PY
          git diff --cached --check
          pip install -e '.[dev]'
          python -m pytest tests/ -x -q
          python scripts/resident_home.py check
          python scripts/project_delivery.py check
          git commit -m 'Merge concurrent archive documentation while retaining echo toggle delivery'
          git diff --exit-code 77bc2d042d1843a181c213c21f2138dcd7944fa0 HEAD -- admin pwa shenyu_gateway tests .env.example resident_home_manifest.json
          # This temporary ref is not the PR branch or production. The connector
          # will advance the reviewed PR ref, triggering its ordinary CI.
          git push origin HEAD:refs/heads/chatgpt/echo-toggle-integration-20260918
          mkdir -p /tmp/echo-integration
          git rev-parse HEAD > /tmp/echo-integration/head.txt
          git rev-parse HEAD^{tree} > /tmp/echo-integration/tree.txt
          git diff 77bc2d042d1843a181c213c21f2138dcd7944fa0 HEAD > /tmp/echo-integration/integration.patch
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: echo-toggle-integration
          path: /tmp/echo-integration/
          retention-days: 3
