name: PWA retention workbench (temporary)
on:
  push:
    branches: [fix/pwa-record-retention]
    paths:
      - .github/pwa-retention/**
      - .github/workflows/pwa-retention-workbench.yml
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/fix/pwa-record-retention'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-record-retention
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: pip install -e '.[dev]'
      - run: npm ci
        working-directory: pwa
      - run: npm ci
        working-directory: admin
      - name: Install isolated Playwright Chromium
        working-directory: admin
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npm run test:e2e:install
      - run: python .github/pwa-retention/driver.py
      - name: Export source receipt
        if: always()
        run: |
          mkdir -p /tmp/retention-source
          git bundle create /tmp/retention-source/repository.bundle --all
          git rev-parse HEAD > /tmp/retention-source/head.txt
          git diff --binary > /tmp/retention-source/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-final-verification
          path: |
            admin/playwright-report/
            admin/test-results/
            /tmp/retention-source/
          if-no-files-found: ignore
          retention-days: 3
