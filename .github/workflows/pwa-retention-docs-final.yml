name: PWA retention documentation check (temporary)
on:
  push:
    branches: [fix/pwa-record-retention]
    paths: [.github/workflows/pwa-retention-docs-final.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-record-retention
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Remove stale duplicate SW description and check current map
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/pwa-record-retention'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == '9bd79825d6415f982b8e3946237f69b0595c0b5b'
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          path = Path('README.md'); source = path.read_text()
          old = "An installed PWA does not switch versions the moment you deploy. The Service Worker paints the cached shell first, then fetches the new one, activates it, and only then does `main.ts` force a reload. So a device can run the previous bundle for the first moments of a launch — long enough for it to persist state. That is why `pwa/src/session/persistence.ts` carries unknown fields through a round-trip instead of rebuilding rows from scratch: a stale bundle must be able to skip a field, never erase it."
          new = "An installed PWA does not switch versions the moment you deploy, and an update must not force a reload of an active chat. `docs/architecture/REQUEST_CONTEXT.md` § Transcript identity and recovery owns paired-build precaching, waiting-worker activation, per-session persistence and legacy-data migration. Verify the active build in Settings after a normal close/reopen; do not clear browser site data as an update procedure."
          assert source.count(old) == 1
          source = source.replace(old, new)
          assert source.count('roll variants, persistence window limits, SSE parsing') == 1
          source = source.replace('roll variants, persistence window limits, SSE parsing', 'roll variants, lossless per-session persistence, SSE parsing')
          path.write_text(source)
          subprocess.run(['python','-m','pytest','tests/test_project_map.py','tests/test_owner_project_map.py','tests/test_project_delivery.py','-q'],check=True)
          subprocess.run(['python','scripts/resident_home.py','check'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','rm','--','.github/workflows/pwa-retention-docs-final.yml'],check=True)
          subprocess.run(['git','add','--','README.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','shenyugateway repair workbench'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','docs(pwa): align deployment guidance with non-disruptive updates'],check=True)
          assert subprocess.check_output(['git','diff','--name-only','9bd79825d6415f982b8e3946237f69b0595c0b5b','HEAD'],text=True).strip() == 'README.md'
          subprocess.run(['git','push','origin','HEAD:refs/heads/work/pwa-retention-docs-checked'],check=True)
          print('CHECKED_HEAD',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
          print('CHECKED_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),flush=True)
          PY
